bundle:
  name: oracle_qbc_ingestion
  engine: direct

include:
  - resources/*.yml

variables:
  connection_name:
    description: UC connection to Oracle. Changing this on a deployed pipeline recreates it and drops its tables.
  source_catalog:
    description: Oracle service name (QBC source_catalog)
  source_schema:
    description: Oracle schema / owner, UPPERCASE
    default: APP_OWNER
  dest_catalog:
    description: Destination UC catalog
  dest_schema:
    description: Destination UC schema
    default: erp_bronze
  schedule_cron:
    description: Quartz cron for the orchestration job
    default: "0 0 2 * * ?"
  periodic_refresh_cron:
    description: Quartz cron for the periodic full refresh of incremental+periodic tables (job is paused by default)
    default: "0 0 3 1 * ?"
  schedule_timezone:
    default: America/Los_Angeles
  notify_email:
    description: Failure notifications
    default: data-platform@example.org

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-0000000000000000.0.azuredatabricks.net
    variables:
      connection_name: oracle_erp_dev
      source_catalog: ERPDEV
      dest_catalog: dev_bronze

  qa:
    workspace:
      host: https://adb-1111111111111111.1.azuredatabricks.net
    variables:
      connection_name: oracle_erp_qa
      source_catalog: ERPQA
      dest_catalog: qa_bronze

  prod:
    mode: production
    workspace:
      host: https://adb-2222222222222222.2.azuredatabricks.net
    run_as:
      service_principal_name: 00000000-0000-0000-0000-000000000000
    variables:
      connection_name: oracle_erp_prod
      source_catalog: ERPPRD
      dest_catalog: prod_bronze
