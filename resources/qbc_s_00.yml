resources:
  pipelines:
    qbc_s_00:
      name: ${bundle.target}_qbc_s_00
      catalog: ${var.dest_catalog}
      target: ${var.dest_schema}
      serverless: true
      ingestion_definition:
        connection_name: ${var.connection_name}
        objects:
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: HR_PAY_STAGE
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              destination_table: hr_pay_stage
              table_configuration:
                scd_type: SCD_TYPE_1
                primary_keys:
                  - EMPLID
                  - PAY_END_DT
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: VENDOR
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              destination_table: vendor
              table_configuration:
                scd_type: SCD_TYPE_1
                primary_keys:
                  - VEND_CUST_CD
                query_based_connector_config:
                  cursor_columns:
                    - LAST_UPDATE_DT
                  hard_deletion_sync_min_interval_in_seconds: 86400
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: FUND
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              destination_table: fund
              table_configuration:
                scd_type: SCD_TYPE_1
                primary_keys:
                  - FUND_CD
                  - BFY
                query_based_connector_config:
                  cursor_columns:
                    - LAST_UPDATE_DT
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: DEPT
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              destination_table: dept
              table_configuration:
                scd_type: SCD_TYPE_1
                primary_keys:
                  - DEPT_CD
                query_based_connector_config:
                  cursor_columns:
                    - LAST_UPDATE_DT
