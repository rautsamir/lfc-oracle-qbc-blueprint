resources:
  pipelines:
    qbc_xl_01_jrnl_actg:
      name: ${bundle.target}_qbc_xl_01_jrnl_actg
      catalog: ${var.dest_catalog}
      target: ${var.dest_schema}
      serverless: true
      configuration:
        dlt-pipelines.qbcPartitionColumn: REC_NO
      ingestion_definition:
        connection_name: ${var.connection_name}
        objects:
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: JRNL_ACTG
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              destination_table: jrnl_actg
              table_configuration:
                scd_type: SCD_TYPE_1
                primary_keys:
                  - BFY
                  - DOC_CD
                  - DOC_DEPT_CD
                  - DOC_ID
                  - REC_NO
                query_based_connector_config:
                  cursor_columns:
                    - TBL_LAST_DT
