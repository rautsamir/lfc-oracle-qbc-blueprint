resources:
  pipelines:
    qbc_xl_00_doc_actg:
      name: ${bundle.target}_qbc_xl_00_doc_actg
      catalog: ${var.dest_catalog}
      target: ${var.dest_schema}
      serverless: true
      ingestion_definition:
        connection_name: ${var.connection_name}
        objects:
          - table:
              source_catalog: ${var.source_catalog}
              source_schema: ${var.source_schema}
              source_table: DOC_ACTG
              destination_catalog: ${var.dest_catalog}
              destination_schema: ${var.dest_schema}
              destination_table: doc_actg
              table_configuration:
                scd_type: SCD_TYPE_1
                primary_keys:
                  - DOC_CD
                  - DOC_DEPT_CD
                  - DOC_ID
                  - DOC_VERS_NO
                  - DOC_ACTG_LN_NO
                query_based_connector_config:
                  cursor_columns:
                    - DOC_LAST_DT
                  hard_deletion_sync_min_interval_in_seconds: 86400
